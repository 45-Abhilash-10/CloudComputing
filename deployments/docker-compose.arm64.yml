version: '3.8'

# ARM64 Optimized Deployment (Raspberry Pi 4 / AWS Graviton3)
# Pinning to 4 physical cores and 4GB RAM envelope with cgroup resource restrictions

services:
  docker-go-arm64:
    build:
      context: ../services/docker-go
      dockerfile: Dockerfile
    image: mobilenetv2-go:arm64
    container_name: rpi4-docker-go
    platform: linux/arm64
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - GOMAXPROCS=4
    deploy:
      resources:
        limits:
          cpus: '3.5'
          memory: 512M
    restart: always

  docker-python-arm64:
    build:
      context: ../services/docker-python
      dockerfile: Dockerfile
    image: mobilenetv2-python:arm64
    platform: linux/arm64
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - NUM_THREADS=4
      - OMP_NUM_THREADS=4
    volumes:
      - ../models:/models:ro
    deploy:
      resources:
        limits:
          cpus: '3.5'
          memory: 1024M
    restart: always
