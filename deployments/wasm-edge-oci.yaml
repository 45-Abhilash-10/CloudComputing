# Kubernetes / K3s / containerd RuntimeClass specification for WasmEdge
# Uses CNCF runwasi containerd shim: containerd-shim-wasmedge-v1

apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: wasm-wasmedge
handler: wasmedge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wasm-mobilenetv2-inference
  labels:
    app: wasm-mobilenetv2
    arch: multi-arch
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wasm-mobilenetv2
  template:
    metadata:
      labels:
        app: wasm-mobilenetv2
    spec:
      runtimeClassName: wasm-wasmedge
      containers:
        - name: inference-worker
          image: ghcr.io/benchmark-team3/wasm-mobilenetv2:v1.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "16Mi"
              cpu: "100m"
            limits:
              memory: "64Mi"
              cpu: "1000m"
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: wasm-mobilenetv2-service
spec:
  type: ClusterIP
  selector:
    app: wasm-mobilenetv2
  ports:
    - name: http
      port: 80
      targetPort: 8080
