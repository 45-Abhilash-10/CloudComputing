[package]
name = "wasm-mobilenetv2-inference"
version = "0.1.0"
edition = "2021"
authors = ["Team 3 <benchmark-team3@univ.edu>"]
description = "WebAssembly MobileNetV2 image classification microservice for WasmEdge and Wasmtime"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "wasm_inference_server"
path = "src/main.rs"

[dependencies]
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"

# WASI-NN bindings for hardware-accelerated WasmEdge inference
[target.'cfg(target_os = "wasi")'.dependencies]
# wasi-nn bindings when targeting wasm32-wasi
# wasi-nn = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
